<!-- templates/register.html -->
{% extends "base.html" %}

{% block title %}Criar Comentador - Opinião ao Xampu [!]{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-6 cyber-glow text-center">JOIN THE COLLECTIVE</h2>
    
    <form method="POST" class="space-y-4">
        <div>
            <input type="text" name="username" placeholder="Pseudônimo" 
                   class="w-full p-3 bg-transparent border border-current" required>
        </div>
        <div>
            <input type="email" name="email" placeholder="E-mail" 
                   class="w-full p-3 bg-transparent border border-current" required>
        </div>
        <div>
            <input type="password" name="password" placeholder="Senha" 
                   class="w-full p-3 bg-transparent border border-current" required>
        </div>
        <button type="submit" class="w-full p-3 border border-current hover:bg-current hover:text-inverse">
            Criar e Usar Pseudônimo
        </button>
    </form>
    
    <p class="mt-6 text-center text-sm opacity-70">
        Possui pseudônimo? <a href="{{ url_for('login') }}" class="underline">Adentre-o aqui!</a>
    </p>
</div>
{% endblock %}
