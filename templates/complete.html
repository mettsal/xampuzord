<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybernetic Poetry Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --font-family: 'Consolas', 'Courier New', monospace;
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent: #00ff00;
        }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        
        body.dark {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent: #00ff00;
        }
        
        .cyber-glow {
            text-shadow: 0 0 10px var(--accent);
        }
        
        .post-card {
            border: 1px solid var(--text-color);
            transition: all 0.3s;
        }
        
        .post-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        
        .tag-pill {
            background: linear-gradient(45deg, transparent, var(--accent), transparent);
            background-size: 200% 200%;
            animation: shimmer 3s ease infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .editor-preview {
            border-left: 2px solid var(--accent);
            padding-left: 1rem;
        }
        
        #loadingIndicator {
            display: none;
        }
        
        .loading #loadingIndicator {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="border-b border-current p-4 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold cyber-glow">CYBERPOETRY://</h1>
            <div class="flex items-center gap-4">
                <input type="text" id="searchBar" placeholder="Search tags..." 
                       class="px-3 py-1 bg-transparent border border-current">
                <button id="themeToggle" class="px-3 py-1 border border-current hover:bg-current hover:text-inverse">
                    ⚡ Tema
                </button>
                <button id="newPostBtn" class="px-3 py-1 border border-current hover:bg-current hover:text-inverse">
                    + Novo Post
                </button>
                <button id="loginBtn" class="px-3 py-1 border border-current hover:bg-current hover:text-inverse">
                    Entrar
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4">
        <!-- Post Grid -->
        <div id="postGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Posts will be dynamically loaded here -->
        </div>
        
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center py-8">
            <span class="cyber-glow">Carregando mais posts...</span>
        </div>
        
        <!-- Sentinel for infinite scroll -->
        <div id="scrollSentinel" class="h-1"></div>
    </main>

    <!-- Post Editor Modal -->
    <div id="editorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="container mx-auto mt-10 p-6 bg-[var(--bg-color)] border-2 border-current max-w-4xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold cyber-glow">Criar/Editar Post</h2>
                <button id="closeEditor" class="text-2xl hover:text-[var(--accent)]">&times;</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Editor Panel -->
                <div>
                    <input type="text" id="postTitle" placeholder="Title..." 
                           class="w-full mb-3 p-2 bg-transparent border border-current">
                    
                    <div class="mb-3 flex gap-2">
                        <select id="fontSelector" class="px-2 py-1 bg-transparent border border-current">
                            <option value="Consolas">Consolas</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Monaco">Monaco</option>
                            <option value="Fira Code">Fira Code</option>
                        </select>
                        
                        <input type="text" id="tagInput" placeholder="Tags (comma-separated)" 
                               class="flex-1 px-2 py-1 bg-transparent border border-current">
                    </div>
                    
                    <textarea id="postBody" placeholder="Write your poetry in Markdown..." 
                              class="w-full h-96 p-3 bg-transparent border border-current font-mono"></textarea>
                    
                    <div class="mt-3 flex gap-2">
                        <button id="savePost" class="px-4 py-2 border border-current hover:bg-current hover:text-inverse">
                            SAVE
                        </button>
                        <button id="togglePreview" class="px-4 py-2 border border-current hover:bg-current hover:text-inverse">
                            PREVIEW
                        </button>
                    </div>
                </div>
                
                <!-- Preview Panel -->
                <div id="previewPanel" class="editor-preview hidden">
                    <h3 class="text-lg font-bold mb-2">PREVIEW:</h3>
                    <div id="previewContent" class="prose prose-invert max-w-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        const state = {
            posts: [],
            currentPage: 1,
            loading: false,
            searchTags: [],
            isLoggedIn: false,
            currentUser: null,
            editingPost: null
        };

        // Mock Data Generator
        function generateMockPosts(page) {
            const posts = [];
            const genres = ['cybernetic', 'digital', 'glitch', 'neural', 'quantum'];
            const years = ['2023', '2024', '2025'];
            
            for (let i = 0; i < 9; i++) {
                const postNum = (page - 1) * 9 + i + 1;
                posts.push({
                    id: postNum,
                    title: `Digital Dreams #${postNum}`,
                    body_html: `<p>In circuits deep where data flows<br/>
                               Through silicon and chrome<br/>
                               The ghost machine forever knows<br/>
                               The path that leads us home</p>
                               <p>Binary stars in cyber skies<br/>
                               Illuminate the void<br/>
                               Where consciousness and code comprise<br/>
                               The dreams we've deployed</p>`,
                    author: `poet_${Math.floor(Math.random() * 5) + 1}`,
                    created_at: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toISOString(),
                    tags: [
                        { type: 'genre', value: genres[Math.floor(Math.random() * genres.length)] },
                        { type: 'year', value: years[Math.floor(Math.random() * years.length)] }
                    ],
                    views: Math.floor(Math.random() * 1000)
                });
            }
            return posts;
        }

        // DOM Elements
        const postGrid = document.getElementById('postGrid');
        const scrollSentinel = document.getElementById('scrollSentinel');
        const themeToggle = document.getElementById('themeToggle');
        const searchBar = document.getElementById('searchBar');
        const newPostBtn = document.getElementById('newPostBtn');
        const loginBtn = document.getElementById('loginBtn');
        const editorModal = document.getElementById('editorModal');
        const closeEditor = document.getElementById('closeEditor');
        const savePost = document.getElementById('savePost');
        const togglePreview = document.getElementById('togglePreview');
        const previewPanel = document.getElementById('previewPanel');
        const previewContent = document.getElementById('previewContent');
        const postTitle = document.getElementById('postTitle');
        const postBody = document.getElementById('postBody');
        const tagInput = document.getElementById('tagInput');
        const fontSelector = document.getElementById('fontSelector');

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const theme = document.body.classList.contains('dark') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
        });

        // Post Rendering
        function renderPost(post) {
            const postCard = document.createElement('div');
            postCard.className = 'post-card p-4 hover:scale-105 transition-transform cursor-pointer';
            postCard.innerHTML = `
                <h3 class="text-lg font-bold mb-2">${post.title}</h3>
                <div class="text-sm mb-3 opacity-70">
                    @${post.author} • ${new Date(post.created_at).toLocaleDateString()}
                </div>
                <div class="mb-3 line-clamp-4">
                    ${post.body_html}
                </div>
                <div class="flex flex-wrap gap-2 mb-2">
                    ${post.tags.map(tag => `
                        <span class="tag-pill px-2 py-1 text-xs border border-current">
                            ${tag.type}:${tag.value}
                        </span>
                    `).join('')}
                </div>
                <div class="text-xs opacity-50">
                    👁 ${post.views} views
                </div>
            `;
            
            postCard.addEventListener('click', () => openPost(post));
            return postCard;
        }

        function openPost(post) {
            // In a real app, this would navigate to a full post view
            console.log('Opening post:', post);
        }

        // Infinite Scroll
        async function loadPosts() {
            if (state.loading) return;
            
            state.loading = true;
            document.body.classList.add('loading');
            
            // Simulate API call
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const newPosts = generateMockPosts(state.currentPage);
            
            // Filter by search tags if any
            const filteredPosts = state.searchTags.length > 0 
                ? newPosts.filter(post => 
                    post.tags.some(tag => 
                        state.searchTags.includes(tag.value)
                    )
                )
                : newPosts;
            
            filteredPosts.forEach(post => {
                postGrid.appendChild(renderPost(post));
            });
            
            state.posts.push(...filteredPosts);
            state.currentPage++;
            state.loading = false;
            document.body.classList.remove('loading');
        }

        // Intersection Observer for Infinite Scroll
        const observer = new IntersectionObserver(
            entries => {
                if (entries[0].isIntersecting && !state.loading) {
                    loadPosts();
                }
            },
            { threshold: 0.1 }
        );

        observer.observe(scrollSentinel);

        // Search Functionality
        searchBar.addEventListener('input', (e) => {
            const searchValue = e.target.value.toLowerCase();
            state.searchTags = searchValue ? searchValue.split(',').map(t => t.trim()) : [];
            
            // Clear and reload posts with filter
            postGrid.innerHTML = '';
            state.posts = [];
            state.currentPage = 1;
            loadPosts();
        });

        // Editor Functionality
        newPostBtn.addEventListener('click', () => {
            if (!state.isLoggedIn) {
                alert('Please login to create posts');
                return;
            }
            editorModal.classList.remove('hidden');
        });

        closeEditor.addEventListener('click', () => {
            editorModal.classList.add('hidden');
            state.editingPost = null;
        });

        togglePreview.addEventListener('click', () => {
            previewPanel.classList.toggle('hidden');
            if (!previewPanel.classList.contains('hidden')) {
                const html = marked.parse(postBody.value);
                previewContent.innerHTML = `
                    <h2 class="text-xl font-bold mb-3">${postTitle.value || 'Untitled'}</h2>
                    ${html}
                `;
            }
        });

        // Auto-save to localStorage
        let autoSaveTimer;
        postBody.addEventListener('input', () => {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                const draft = {
                    title: postTitle.value,
                    body: postBody.value,
                    tags: tagInput.value,
                    font: fontSelector.value
                };
                localStorage.setItem('draft', JSON.stringify(draft));
                console.log('Draft saved');
            }, 1000);
        });

        // Load draft on page load
        function loadDraft() {
            const draft = localStorage.getItem('draft');
            if (draft) {
                const { title, body, tags, font } = JSON.parse(draft);
                postTitle.value = title || '';
                postBody.value = body || '';
                tagInput.value = tags || '';
                fontSelector.value = font || 'Consolas';
            }
        }

        savePost.addEventListener('click', () => {
            const post = {
                title: postTitle.value,
                body_html: marked.parse(postBody.value),
                tags: tagInput.value.split(',').map(t => {
                    const tag = t.trim();
                    const isYear = /^\d{4}$/.test(tag);
                    return {
                        type: isYear ? 'year' : 'genre',
                        value: tag
                    };
                }),
                author: state.currentUser || 'anonymous',
                created_at: new Date().toISOString(),
                views: 0
            };
            
            // In a real app, this would POST to the server
            console.log('Saving post:', post);
            
            // Add to grid
            const postElement = renderPost(post);
            postGrid.insertBefore(postElement, postGrid.firstChild);
            
            // Clear form and close modal
            postTitle.value = '';
            postBody.value = '';
            tagInput.value = '';
            localStorage.removeItem('draft');
            editorModal.classList.add('hidden');
            
            alert('Post saved successfully!');
        });

        // Font selector
        fontSelector.addEventListener('change', (e) => {
            postBody.style.fontFamily = e.target.value;
        });

        // Mock Login
        loginBtn.addEventListener('click', () => {
            if (state.isLoggedIn) {
                state.isLoggedIn = false;
                state.currentUser = null;
                loginBtn.textContent = 'LOGIN';
                alert('Logged out');
            } else {
                // Mock login
                state.isLoggedIn = true;
                state.currentUser = 'cyber_poet_' + Math.floor(Math.random() * 1000);
                loginBtn.textContent = 'LOGOUT';
                alert(`Logged in as ${state.currentUser}`);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl+S to save
            if (e.ctrlKey && e.key === 's' && !editorModal.classList.contains('hidden')) {
                e.preventDefault();
                savePost.click();
            }
            
            // Ctrl+P to preview
            if (e.ctrlKey && e.key === 'p' && !editorModal.classList.contains('hidden')) {
                e.preventDefault();
                togglePreview.click();
            }
            
            // ESC to close modal
            if (e.key === 'Escape' && !editorModal.classList.contains('hidden')) {
                closeEditor.click();
            }
        });

        // Initialize
        initTheme();
        loadDraft();
        loadPosts();
    </script>
</body>
</html>
